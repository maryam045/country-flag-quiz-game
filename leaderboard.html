<!DOCTYPE html>
<html lang="en">
     <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>LEADERBOARD</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="icons/futminna.png">
    </head>
    <body data-page="leaderboard">
        <div class="leaderboard-container">
            <h1><img src="icons/award-64x64 (1).png"> LEADERBOARD</h1>
            <p class="top-players">Top players</p>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Player</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <!-- Rows injected by script.js -->
                </tbody>
            </table>
            <button class="home-btn" id="leaderboard-home-btn">HOME</button>
        </div>

        <script src="script.js"></script>
    </body>
</html>
