<!DOCTYPE html>
<html lang="en"> 
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
                <title>QUIZ RESULT</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="icons/futminna.png">
    </head>
    <body data-page="result">
        <div class="result-container">
            <h1><img src="icons/globe-64x64.png"> Quiz Completed!</h1>
            <p class="test"> Congratulations on completing the quiz
                You scored <span id="result-score">0</span> out of <span id="result-total">10</span></p>
            <p class="high-score"><img src="icons/award-64x64 (1).png" alt="trophy" class="trophy-icon"> HIGH SCORE: <span id="result-high-score">0</span></p>
            <div class="button-container">
                <button class="play-again" id="play-again-btn">PLAY AGAIN</button>
                <button class="home-btn" id="result-home-btn">HOME</button>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
